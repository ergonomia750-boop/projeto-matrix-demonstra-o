<!DOCTYPE html>
<html lang="pt-BR">

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#c9d1d9}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
#tela{flex:1;min-height:0;overflow:auto;padding:12px 14px;font:14px/1.4 ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,"Liberation Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2;cursor:text;outline:none;scrollbar-width:thin;scrollbar-color:#30363d #000;-webkit-overflow-scrolling:touch}
#tela::selection,#tela *::selection{background:#1f6f3a;color:#fff}
.cur{display:inline-block;width:.6em;height:1.15em;background:#c9d1d9;vertical-align:text-bottom;animation:pisca 1s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}
.dica{color:#6e7681}
.c{color:#8b949e}.k{color:#ff7b72}.t{color:#7ee787}.a{color:#79c0ff}.s{color:#a5d6ff}.n{color:#79c0ff}.f{color:#d2a8ff}
.extra{display:none;grid-template-columns:repeat(7,1fr);gap:1px;background:#000;padding-bottom:env(safe-area-inset-bottom,0)}
.extra button{height:46px;border:0;background:#1c1c1c;color:#fff;font:600 .78rem ui-monospace,Menlo,Consolas,monospace;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.extra button:active{background:#333}
@media (pointer:coarse){.extra{display:grid}#tela{font-size:13px;padding:10px}}
#entrada{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;resize:none;pointer-events:none}
#site{position:fixed;inset:0;z-index:10;background:#000}
#site[hidden]{display:none}
#site iframe{width:100%;height:100%;border:0;background:#fff}
#siteX{position:absolute;top:10px;right:10px;min-height:40px;padding:0 14px;border-radius:6px;border:1px solid #30363d;background:rgba(0,0,0,.75);color:#fff;font:600 .85rem ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
#siteX:focus-visible,#tela:focus-visible{outline:2px solid #3fb950}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
</head>
<body>
<main id="tela" tabindex="0" aria-label="Terminal. Digite qualquer tecla para escrever o código do site."></main>
<div class="extra" id="extra" aria-hidden="true"><button type="button">ESC</button><button type="button">/</button><button type="button">-</button><button type="button">HOME</button><button type="button">↑</button><button type="button">END</button><button type="button">PGUP</button><button type="button">TAB</button><button type="button">CTRL</button><button type="button">ALT</button><button type="button">←</button><button type="button">↓</button><button type="button">→</button><button type="button">PGDN</button></div>
<textarea id="entrada" aria-label="Digite aqui para escrever o código" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" tabindex="-1"></textarea>
<div id="site" hidden><button id="siteX" type="button">✕ fechar (Esc)</button><iframe id="siteFrame" title="Site escrito pelo código" sandbox></iframe></div>

<!-- ===== CÓDIGO QUE SERÁ "DIGITADO" (edite aqui, em texto puro) =====
     Dica: não escreva a tag de script dentro dele. Use 2 espaços para recuar as linhas. -->
<script type="text/plain" id="codigo"><!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Técnico em Segurança do Trabalho</title>
  <style>
    /* Paleta do curso */
    :root {
      --amarelo: #f5b700;
      --escuro: #0f172a;
      --claro: #f8fafc;
      --verde: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--claro);
      color: var(--escuro);
      line-height: 1.6;
    }
    header {
      background: var(--escuro);
      color: var(--claro);
      padding: 56px 24px;
      text-align: center;
      border-bottom: 6px solid var(--amarelo);
    }
    header h1 { font-size: 2rem; }
    header p { margin-top: 12px; color: #cbd5e1; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
    h2 {
      margin: 32px 0 16px;
      padding-left: 12px;
      border-left: 6px solid var(--amarelo);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
    }
    .card h3 { margin-bottom: 8px; color: var(--verde); }
    .nrs { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; }
    .nrs li {
      background: var(--escuro);
      color: var(--amarelo);
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
    }
    footer { text-align: center; padding: 24px; color: #64748b; }
  </style>
</head>
<body>
  <!-- Topo da página -->
  <header>
    <h1>Técnico em Segurança do Trabalho</h1>
    <p>Prevenir acidentes é proteger vidas.</p>
  </header>

  <!-- Conteúdo principal -->
  <main>
    <h2>O que faz o técnico</h2>
    <section class="cards">
      <article class="card">
        <h3>Prevenção</h3>
        <p>Identifica riscos nos ambientes de trabalho e propõe medidas para eliminá-los ou controlá-los.</p>
      </article>
      <article class="card">
        <h3>Inspeção</h3>
        <p>Acompanha o uso correto dos EPIs, a sinalização e as condições de máquinas e instalações.</p>
      </article>
      <article class="card">
        <h3>Treinamento</h3>
        <p>Orienta os trabalhadores com diálogos de segurança, treinamentos e campanhas.</p>
      </article>
      <article class="card">
        <h3>Investigação</h3>
        <p>Analisa as causas de acidentes e incidentes para evitar que se repitam.</p>
      </article>
    </section>

    <h2>Normas Regulamentadoras</h2>
    <ul class="nrs">
      <li>NR-01 Disposições gerais</li>
      <li>NR-05 CIPA</li>
      <li>NR-06 EPI</li>
      <li>NR-10 Eletricidade</li>
      <li>NR-12 Máquinas</li>
      <li>NR-17 Ergonomia</li>
      <li>NR-35 Trabalho em altura</li>
    </ul>

    <h2>Onde atua</h2>
    <p>Indústrias, obras, hospitais, empresas de serviços e qualquer ambiente com risco para o trabalhador.</p>
  </main>

  <footer>Turma de Técnico em Segurança do Trabalho</footer>
</body>
</html>
</script>

<script>
// Quantos caracteres aparecem a cada tecla (1 = letra por letra). Também dá para usar ?v=4 no endereço.
const CARACTERES_POR_TECLA=1;

const $=id=>document.getElementById(id);
const CODIGO=$('codigo').textContent;
const V=Math.max(1,Math.min(12,parseInt(new URLSearchParams(location.search).get('v'),10)||CARACTERES_POR_TECLA));

//LOGICA-INI
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// Colore o código como o GitHub (tema escuro). Funciona mesmo com o texto pela metade.
function realcar(src){
  const L=[];let cur='',i=0,m,st='h',tn='',dep=0,val=false;
  const out=(c,t)=>t.split('\n').forEach((p,k)=>{if(k){L.push(cur);cur=''}if(p)cur+=c?`<span class="${c}">${esc(p)}</span>`:esc(p)});
  const re=r=>{r.lastIndex=i;m=r.exec(src);return !!m};
  while(i<src.length){
    m=null;
    if(st==='h'){
      if(re(/<!--[\s\S]*?(?:-->|$)/y))out('c',m[0]);
      else if(re(/<![^>]*>?/y))out('n',m[0]);
      else if(re(/(<\/?)([A-Za-z][\w-]*)?/y)){out('',m[1]);if(m[2]){out('t',m[2]);tn=m[1]==='<'?m[2].toLowerCase():'';st='tag'}}
      else if(re(/[^<]+/y))out('',m[0]);
      else{out('',src[i]);m=[src[i]]}
    }else if(st==='tag'){
      if(re(/\s+/y))out('',m[0]);
      else if(re(/\/?>/y)){out('',m[0]);st=(tn==='style'&&m[0]==='>')?'css':'h'}
      else if(re(/"[^"]*"?|'[^']*'?/y))out('s',m[0]);
      else if(re(/=/y))out('',m[0]);
      else if(re(/[^\s=\/>"']+/y))out('a',m[0]);
      else{out('',src[i]);m=[src[i]]}
    }else{
      if(re(/<\/style/iy)){st='h';continue}
      if(re(/\/\*[\s\S]*?(?:\*\/|$)/y))out('c',m[0]);
      else if(re(/\s+/y))out('',m[0]);
      else if(re(/"[^"\n]*"?|'[^'\n]*'?/y))out('s',m[0]);
      else if('{};'.includes(src[i])){if(src[i]==='{')dep++;else if(src[i]==='}')dep=Math.max(0,dep-1);val=false;out('',src[i]);m=[src[i]]}
      else if(dep===0){
        if(re(/@[\w-]+/y))out('k',m[0]);
        else if(re(/[.#][\w-]+/y))out('n',m[0]);
        else if(re(/:{1,2}[\w-]+(?:\([^)]*\))?/y))out('f',m[0]);
        else if(re(/[\w-]+|\*/y))out('t',m[0]);
        else{out('',src[i]);m=[src[i]]}
      }else if(!val){
        if(src[i]===':'){val=true;out('',':');m=[':']}
        else if(re(/[\w-]+/y))out('a',m[0]);
        else{out('',src[i]);m=[src[i]]}
      }else{
        if(re(/#[0-9a-fA-F]+/y))out('n',m[0]);
        else if(re(/-?\d*\.?\d+(?:%|[a-zA-Z]+)?/y))out('n',m[0]);
        else if(re(/--[\w-]+/y))out('a',m[0]);
        else if(re(/[A-Za-z_][\w-]*(?=\()/y))out('f',m[0]);
        else if(re(/[A-Za-z_][\w-]*/y))out('n',m[0]);
        else{out('',src[i]);m=[src[i]]}
      }
    }
    i+=m[0].length;
  }
  L.push(cur);return L;
}

const BANNER='Welcome to Termux!\n\nCurso: Técnico em Segurança do Trabalho\n\n',PROMPT='~/curso-tst $ ';
const ANTES="cat > index.html << 'EOF'\n",DEPOIS='EOF\n',TOTAL=ANTES.length+CODIGO.length+DEPOIS.length;
// Monta o que aparece na tela depois de n caracteres.
function montar(n){
  const a=ANTES.slice(0,Math.min(n,ANTES.length));
  const c=n>ANTES.length?CODIGO.slice(0,Math.min(n-ANTES.length,CODIGO.length)):'';
  const d=n>ANTES.length+CODIGO.length?DEPOIS.slice(0,n-ANTES.length-CODIGO.length):'';
  let h=BANNER+PROMPT+esc(a);
  if(c)h+=realcar(c).join('\n');
  if(d)h+=esc(d);
  if(n>=TOTAL)return h+PROMPT+'<span class="cur"></span><span class="dica"># pressione qualquer tecla para abrir o site</span>';
  return h+'<span class="cur"></span>'+(n?'':'<span class="dica"> digite qualquer tecla…</span>');
}
//LOGICA-FIM

// ---------- escrita ----------
const tela=$('tela'),entrada=$('entrada');
let idx=0,pendente=false,fimEm=0;
function desenhar(){pendente=false;tela.innerHTML=montar(idx);tela.scrollTop=tela.scrollHeight}
function tecla(n,repetida){
  if(idx>=TOTAL){if(!repetida&&performance.now()-fimEm>800)abrirSite();return}
  idx=Math.min(TOTAL,idx+n);if(idx>=TOTAL)fimEm=performance.now();
  if(!pendente){pendente=true;requestAnimationFrame(desenhar)}
}
// site pronto (abre depois que o código termina)
function abrirSite(){$('siteFrame').srcdoc=CODIGO;$('site').hidden=false;$('siteX').focus()}
function fecharSite(){$('site').hidden=true;tela.focus()}
$('siteX').addEventListener('click',fecharSite);

// teclado do computador
document.addEventListener('keydown',e=>{
  if(!$('site').hidden){if(e.key==='Escape')fecharSite();return}
  if(e.ctrlKey||e.metaKey||e.altKey||e.target===entrada)return;
  if(e.key.length>1&&e.key!=='Enter'&&e.key!=='Backspace')return;
  e.preventDefault();tecla(V,e.repeat);
});
// teclado do celular: tocar na tela abre o teclado
const toque=matchMedia('(pointer:coarse)').matches;
entrada.addEventListener('input',()=>{const n=entrada.value.length;entrada.value='';tecla(Math.max(n,1)*V,false)});
tela.addEventListener('click',()=>{if(toque)entrada.focus()});
// teclas extras (como no Termux): tocar escreve; segurar repete
let espera=null,rep=null;
const soltar=()=>{clearTimeout(espera);clearInterval(rep);espera=rep=null};
$('extra').querySelectorAll('button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();tecla(V,false);soltar();espera=setTimeout(()=>{rep=setInterval(()=>tecla(Math.max(2,V),true),40)},350)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,soltar));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
desenhar();
</script>
</body>
</html>
